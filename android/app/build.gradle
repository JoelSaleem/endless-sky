apply plugin: 'com.android.application'

android {
    namespace 'io.github.endless_sky.endless_sky'
    compileSdk 35
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'io.github.endless_sky.endless_sky'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint { abortOnError false }

    androidResources {
        // Endless Sky keeps data under underscore-prefixed dirs (data/_ui, data/_deprecated).
        // AGP's default ignoreAssetsPattern includes the "<dir>_*" token, which drops every
        // underscore-prefixed directory during asset merge -- silently stripping message
        // categories, interfaces, flight checks etc. from the APK and crashing at runtime.
        // Same list as the default, minus "<dir>_*", so those dirs are packaged.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    // Bundled game assets live under build/gameassets (populated by bundleGameAssets).
    sourceSets {
        main { assets.srcDirs += ["${buildDir}/gameassets"] }
    }
}

// Copy the game resources into the APK (under assets/es/) and generate a filelist
// so the native code can extract them to internal storage on first run
// (see ExtractAndroidAssets in source/Files.cpp). Makes the APK self-contained.
tasks.register('bundleGameAssets', Copy) {
    def root = file("${projectDir}/../..")
    into "${buildDir}/gameassets/es"
    from("${root}/data") { into 'data' }
    from("${root}/images") { into 'images' }
    from("${root}/sounds") { into 'sounds' }
    from("${root}/shaders") { into 'shaders' }
    from(root) { include 'credits.txt', 'keys.txt' }
    doLast {
        def base = file("${buildDir}/gameassets/es")
        def names = []
        base.eachFileRecurse { f ->
            if(f.isFile() && f.name != 'filelist.txt' && f.name != 'assetsig.txt')
                names << base.toPath().relativize(f.toPath()).toString().replace('\\', '/')
        }
        new File(base, 'filelist.txt').text = names.join('\n') + '\n'
        // A signature of the packaged asset set (sorted "path:size"). The native
        // extractor re-extracts whenever this differs from the extracted copy, so a
        // new APK (app update or dev rebuild) with changed assets refreshes the data,
        // while an unchanged APK is skipped. See ExtractAndroidAssets in Files.cpp.
        def sig = names.collect { rel -> rel + ':' + new File(base, rel).length() }.sort()
        new File(base, 'assetsig.txt').text = sig.join('\n') + '\n'
    }
}
preBuild.dependsOn bundleGameAssets

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
