apply plugin: 'com.android.application'

android {
    namespace 'io.github.endless_sky.endless_sky'
    compileSdk 35
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'io.github.endless_sky.endless_sky'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint { abortOnError false }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
